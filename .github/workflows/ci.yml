name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taskdeck:ci .
      - name: Run and smoke-test
        run: |
          docker run -d --name taskdeck-ci -p 6090:6090 taskdeck:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6090/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs taskdeck-ci
          if [ -z "$ok" ]; then echo "health check failed"; exit 1; fi
          docker rm -f taskdeck-ci
